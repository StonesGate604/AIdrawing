<!DOCTYPE html>
<html>
<head>
  <title>Drawing Recorder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="drawing_recorder_p5.css">
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="app-name">DRAWREC</span>
  <div class="divider"></div>
  <button class="top-btn" onclick="undoLast()">Undo</button>
  <button class="top-btn" onclick="clearDrawing()">Clear</button>
  <button class="top-btn" onclick="toggleRecording()" id="rec-top-btn">⏺ Record</button>
  <button class="top-btn" onclick="saveData()">⬇ Save</button>
</div>

<!-- LEFT TOOLBAR -->
<div id="toolbar">
  <button class="tool-btn selected" id="btn-brush" onclick="selectTool('brush')" title="Brush">✏️</button>
  <button class="tool-btn" id="btn-eraser" onclick="selectTool('eraser')" title="Eraser">⬜</button>
  <button class="tool-btn" id="btn-fill" onclick="selectTool('fill')" title="Fill">🪣</button>
</div>

<!-- CANVAS AREA -->
<div id="canvas-area"></div>

<!-- RIGHT PANEL -->
<div id="controls">

  <!-- COLOR -->
  <div class="panel-section">
    <div class="section-title">Color</div>
    <div id="color-row"></div>
  </div>

  <!-- BRUSH -->
  <div class="panel-section">
    <div class="section-title">Brush Size</div>
    <div class="slider-row">
      <input type="range" id="brush-slider" min="2" max="60" value="12"
             oninput="brushSize = parseInt(this.value); document.getElementById('size-label').textContent = brushSize + 'px';">
      <span class="slider-val" id="size-label">12px</span>
    </div>
  </div>

  <!-- RECORD -->
  <div class="panel-section">
    <div class="section-title">Record</div>
    <button class="action-btn" id="rec-btn" onclick="toggleRecording()">⏺ Start Recording</button>
    <button class="action-btn" onclick="saveData()">⬇ Save Data</button>
    <div id="rec-info" style="margin-top:6px;">
      <div>Status: <span id="rec-status">idle</span></div>
      <div>Steps: <span id="step-display">0</span></div>
      <div>Sessions: <span id="session-display">0</span></div>
    </div>
  </div>

  <!-- SKETCHRNN -->
  <div class="panel-section">
    <div class="section-title">SketchRNN</div>
    <select id="ai-model">
      <option value="cat">cat</option>
      <option value="bird">bird</option>
      <option value="flower">flower</option>
      <option value="house">house</option>
      <option value="tree">tree</option>
      <option value="bicycle">bicycle</option>
    </select>
    <button class="action-btn" onclick="loadSketchModel()">🧠 Load Model</button>
    <button class="action-btn" onclick="startSketchRNN()">▶ Start AI Draw</button>
    <button class="action-btn" onclick="stopSketchRNN()">⏹ Stop AI Draw</button>
    <div id="ai-status">status: idle</div>
  </div>

</div>

<!-- BOTTOM TIMELINE -->
<div id="timeline-bar">
  <span class="tl-label">Timeline</span>
  <input type="range" id="timeline" min="0" max="0" value="0"
         oninput="seekTo(parseInt(this.value))">
  <span id="tl-label">step 0</span>
</div>

<script src="drawing_recorder_p5.js"></script>

</body>
</html>
