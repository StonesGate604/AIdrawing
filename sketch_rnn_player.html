<!DOCTYPE html>
<html>
<head>
  <title>SketchRNN Player - AI Drawing Experience</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="drawing_recorder_p5.css">
  <style>
    body {
      background: #f5f5f0;
    }
    #topbar {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .ai-info {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      padding: 8px;
      background: #f9f9f9;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="topbar">
  <span class="app-name">SKETCHRNN PLAYER</span>
  <button class="top-btn" onclick="undoLast()">
    <i data-lucide="undo-2"></i> Undo
  </button>
  <button class="top-btn" onclick="clearDrawing()">
    <i data-lucide="trash-2"></i> Clear
  </button>
  <button class="top-btn" onclick="window.location.href='drawing_recorder.html'" title="Switch to Recorder">
    <i data-lucide="record"></i> To Recorder
  </button>
</div>

<div id="toolbar">
  <button class="tool-btn selected" id="btn-brush" onclick="selectTool('brush')" title="Brush">
    <i data-lucide="pencil"></i>
  </button>
  <button class="tool-btn" id="btn-eraser" onclick="selectTool('eraser')" title="Eraser">
    <i data-lucide="eraser"></i>
  </button>
  <button class="tool-btn" id="btn-fill" onclick="selectTool('fill')" title="Fill">
    <i data-lucide="paint-bucket"></i>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="undoLast()" title="Undo">
    <i data-lucide="undo-2"></i>
  </button>
  <button class="tool-btn" onclick="clearDrawing()" title="Clear">
    <i data-lucide="trash-2"></i>
  </button>
</div>

<div id="canvas-area"></div>

<div id="controls">

    <div class="section-title">Color</div>
    <div id="color-row"></div>
  </div>

  <div class="panel-section">
    <div class="section-title">Brush Size</div>
    <div class="slider-row">
      <input type="range" id="brush-slider" min="2" max="60" value="12"
             oninput="brushSize = parseInt(this.value); document.getElementById('size-label').textContent = brushSize + 'px';">
      <span class="slider-val" id="size-label">12px</span>
    </div>
  </div>

    <div class="section-title">SketchRNN Model</div>

    </select>
    <button class="action-btn" id="load-btn" onclick="loadSketchModel()">
      <i data-lucide="brain"></i> Load Model
    </button>
    <div class="ai-info">
      <div>Model: <span id="ai-model-name">-</span></div>
      <div>Steps: <span id="step-display">0</span></div>
    </div>
  </div>
</div>

<div id="timeline-bar">
  <div id="ai-player-center" aria-label="AI controls">
    <button class="ai-main-btn start" onclick="startSketchRNN()" title="Start AI Draw">
      <i data-lucide="play"></i>
    </button>
    <button class="ai-main-btn stop" onclick="stopSketchRNN()" title="Stop AI Draw">
      <i data-lucide="square"></i>
    </button>
    <span id="ai-status">status: idle</span>
  </div>

  <div class="tl-header">
    <span class="tl-title">Timeline</span>
    <span id="tl-label">step 0</span>
  </div>

  <div class="tl-track">
    <div id="tl-icons"></div>
    <input type="range" id="timeline" min="0" max="0" value="0"
           oninput="seekTo(parseInt(this.value))">
    <div id="tl-cursor" style="left:0"></div>
  </div>
</div>

<script src="drawing_recorder_p5.state.js"></script>
<script src="drawing_recorder_p5.timeline.js"></script>
<script src="drawing_recorder_p5.ai.js"></script>
<script src="drawing_recorder_p5.canvas.js"></script>
<script>
  lucide.createIcons();

  function updateModelDisplay() {
    document.getElementById('ai-model-name').textContent = document.getElementById('ai-model').value || '-';
  }
  document.getElementById('ai-model').addEventListener('change', updateModelDisplay);
  updateModelDisplay();
</script>

</body>
</html>
